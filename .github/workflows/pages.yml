name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/site.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/site.js
          node --check question-pack.js
          node --check backend-config.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('question-pack.js', 'utf8'), context);
          const pack = context.window.RB_QUESTION_PACK;
          if (!Array.isArray(pack) || pack.length !== 27) throw new Error('Expected 27 people in question-pack.js');
          if (new Set(pack.map(x => x.person)).size !== 27) throw new Error('Roster names must be unique');
          for (const q of pack) {
            if (!q.person || !q.department || !q.crop || !q.original) throw new Error('Incomplete roster row: ' + q.id);
          }
          console.log('Validated 27 unique people and their image paths.');
          NODE
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
